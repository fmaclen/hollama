name: ESLint

on:
  pull_request:

jobs:
  lint:
    name: Run linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      # Lists untranslated messages per language, without failing the build
      - run: npm run i18n:check
